version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: conveyor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: conveyor_db
      POSTGRES_USER: conveyor_user
      POSTGRES_PASSWORD: conveyor_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

volumes:
  postgres_data:

